name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core tests
        run: node tool/test.mjs
      - name: Geo picker tests
        run: node tool/test_geo_picker.mjs
      - name: Theme tests
        run: node tool/test_theme.mjs
      - name: Configuration preview tests
        run: node tool/test_config_preview.mjs
      - name: Configuration preview UI tests
        run: node tool/test_config_preview_ui.mjs
      - name: Geo catalog parser tests
        run: python -m unittest discover -s tool -p test_geo_catalog.py
      - name: Validate
        run: python tool/validate.py
      - name: Build
        run: python tool/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
