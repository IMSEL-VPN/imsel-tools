# CI IMSEL Tools: тесты ядра на Node, проверки на Python, деплой Pages.
# Сайт полностью статический — сборка без внешних зависимостей.

stages:
  - test
  - deploy

core-tests:
  stage: test
  image: node:22-alpine
  script:
    - node tool/test.mjs
    - node tool/test_geo_picker.mjs
    - node tool/test_theme.mjs
    - node tool/test_config_preview.mjs
    - node tool/test_config_preview_ui.mjs
    - node tool/test_dns_editor.mjs
    - node tool/test_rules_editor.mjs
    - node tool/test_outbounds_editor.mjs

validate:
  stage: test
  image: python:3.12-alpine
  script:
    - python tool/validate.py
    - python -m unittest discover -s tool -p test_geo_catalog.py

pages:
  stage: deploy
  image: python:3.12-alpine
  script:
    - python tool/build.py
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
